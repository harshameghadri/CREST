# Continuous integration and release.
#
#   every push to main / dev / release/** and every pull request: tests (Linux x86-64 with the oldest
#   and the newest supported Python and NumPy, macOS arm64), baseline, docs, sdist, wheel builds, smoke
#   tests of every wheel family.
#   a tag v<version>: the same, plus publication. Tags that contain "rc" (or any other pre-release
#   marker) go to TestPyPI only; final tags go to PyPI through the `pypi` environment, which
#   needs the owner's approval, and then a GitHub Release is created from the tag.
#   manual run with "publish_testpypi": builds everything and publishes to TestPyPI as a dry run.
#
# See docs/development.md ("Continuous integration" and "Releasing") for the settings the owner
# has to make on GitHub, PyPI and TestPyPI.
name: CI

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'release/**'
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: "Dry run: build every wheel and publish them to TestPyPI"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # the commit of the integrated release branch that the second baseline job builds
  RC0_SHA: d1aaa42685d2ae00efa628e15db7cd0b7c4473a4

jobs:
  version:
    # tag == Cargo.toml == crest.__version__ (PEP 440); decides where a release is published
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      publish_target: ${{ steps.target.outputs.publish_target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install packaging
      - name: Check that the tag, Cargo.toml and crest/__init__.py name the same version
        id: check
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: python .github/scripts/check_release_version.py ${TAG:+"$TAG"} --github-output "$GITHUB_OUTPUT"
      - name: Decide where this run publishes
        id: target
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_testpypi }}
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          target=none
          if [ "$DRY_RUN" = "true" ]; then
            target=testpypi
          elif [ "$IS_TAG" = "true" ]; then
            if [ "$PRERELEASE" = "true" ]; then target=testpypi; else target=pypi; fi
          fi
          echo "publish_target=$target" >> "$GITHUB_OUTPUT"
          echo "publish target: $target"

  tests:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux, Python 3.10, NumPy 1.24 (oldest supported)
            os: ubuntu-22.04
            python: "3.10"
            numpy: "1.24.4"
          - name: linux, Python 3.13, latest NumPy
            os: ubuntu-22.04
            python: "3.13"
            numpy: ""
          - name: macOS arm64, Python 3.11
            os: macos-latest
            python: "3.11"
            numpy: ""
    env:
      CREST_TEST_DATA: ${{ github.workspace }}/.test-data
      CREST_SOURCE_DIR: ${{ github.workspace }}
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Rust unit tests
        run: cargo test --release
      - name: Build the wheel and install it with the test extra
        env:
          NUMPY_SPEC: ${{ matrix.numpy && format('numpy=={0}', matrix.numpy) || '' }}
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip maturin
          maturin build --release --out dist
          pip install "$(ls dist/*.whl | head -n 1)[test]" $NUMPY_SPEC
          pip freeze > pip-freeze.txt
          python -c "import numpy, scipy, scanpy; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'scanpy', scanpy.__version__)"
      - name: Check the NumPy version of this row
        if: matrix.numpy != ''
        run: |
          . .venv/bin/activate
          python -c "import numpy; assert numpy.__version__ == '${{ matrix.numpy }}', numpy.__version__"
      - name: Test data (cached, sha256 verified) and the variables the data-dependent tests read
        uses: ./.github/actions/test-data
      - name: Change fragments are well-formed
        run: python scripts/assemble_changelog.py --check
      - name: Python tests (scanpy, harmonypy, leidenalg, skmisc and skimage parity included; unlisted skips fail)
        run: |
          . .venv/bin/activate
          # run from a copy so that the installed wheel, not the source tree, is imported
          mkdir "$RUNNER_TEMP/run" && cp -r tests pyproject.toml "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run"
          pytest -ra -p no:cacheprovider --skip-allowlist=tests/skip_allowlist.txt
      - name: Upload the resolved environment
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pip-freeze-${{ strategy.job-index }}
          path: pip-freeze.txt
          if-no-files-found: ignore

  test:
    # the single check that summarises the test matrix (kept under this name for branch protection)
    name: test
    if: ${{ always() }}
    needs: [tests]
    runs-on: ubuntu-latest
    steps:
      - name: Every test row passed
        env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "tests: $RESULT"
          [ "$RESULT" = "success" ]

  baseline:
    # Tests marked @pytest.mark.baseline_fails must fail, for the declared reason, on the reference build.
    name: baseline (${{ matrix.ref }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        ref: [v0.4.0, rc0]
    env:
      CREST_SOURCE_DIR: ${{ github.workspace }}
      CREST_BASELINE_REF: ${{ matrix.ref }}
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba-cache
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Create a virtual environment
        run: python -m venv .venv
      - name: Install the published v0.4.0 wheel from PyPI
        if: matrix.ref == 'v0.4.0'
        run: |
          . .venv/bin/activate
          pip install --only-binary=:all: "crest-sc==0.4.0"
      - name: Restore the wheel built from the rc0 commit
        if: matrix.ref == 'rc0'
        id: rc0-cache
        uses: actions/cache@v4
        with:
          path: rc0-wheel
          key: crest-wheel-rc0-${{ env.RC0_SHA }}-linux-x86_64
      - name: Check out the rc0 commit
        if: matrix.ref == 'rc0' && steps.rc0-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RC0_SHA }}
          path: rc0-src
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.ref == 'rc0' && steps.rc0-cache.outputs.cache-hit != 'true'
      - name: Build the rc0 wheel
        if: matrix.ref == 'rc0' && steps.rc0-cache.outputs.cache-hit != 'true'
        run: |
          . .venv/bin/activate
          pip install maturin
          (cd rc0-src && maturin build --release --out "$GITHUB_WORKSPACE/rc0-wheel")
      - name: Install the rc0 wheel
        if: matrix.ref == 'rc0'
        run: |
          . .venv/bin/activate
          pip install "$(ls rc0-wheel/*.whl | head -n 1)"
      - name: Install the test extra of this branch
        run: |
          . .venv/bin/activate
          python .github/scripts/print_extra.py test > test-requirements.txt
          pip install -r test-requirements.txt
      - name: Test data (cached, sha256 verified) and the variables the data-dependent tests read
        uses: ./.github/actions/test-data
      - name: Run the tests marked for this reference build
        run: |
          . .venv/bin/activate
          mkdir "$RUNNER_TEMP/run" && cp -r tests pyproject.toml "$RUNNER_TEMP/run/"
          cd "$RUNNER_TEMP/run"
          python -c "import crest; print(crest.__version__, crest.__file__)"
          pytest -ra -p no:cacheprovider --baseline-ref="$CREST_BASELINE_REF"

  docs:
    # same build as Read the Docs (.readthedocs.yaml): no Rust, native module mocked
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build the documentation (warnings are errors)
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs docs/_build/html

  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
          # 32-bit x86 and armv7 are not published: no CI runner can smoke-test them
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_testpypi }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_testpypi }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_testpypi }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.publish_testpypi }}
      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Check repository and sdist contents
        run: python3 .github/scripts/check_package_contents.py dist/*.tar.gz
      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: wheels-sdist
          path: dist

  smoke:
    # install the built wheel of every published family in a fresh environment, import it, run three core checks
    name: smoke (${{ matrix.family }})
    needs: [version, linux, musllinux, windows, macos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: manylinux x86_64
            runner: ubuntu-22.04
            artifact: wheels-linux-x86_64
          - family: manylinux aarch64
            runner: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - family: musllinux x86_64
            runner: ubuntu-22.04
            artifact: wheels-musllinux-x86_64
            alpine: true
          - family: musllinux aarch64
            runner: ubuntu-24.04-arm
            artifact: wheels-musllinux-aarch64
            alpine: true
          - family: macOS arm64
            runner: macos-latest
            artifact: wheels-macos-aarch64
          - family: macOS x86_64
            runner: macos-15-intel
            artifact: wheels-macos-x86_64
          - family: Windows x64
            runner: windows-latest
            artifact: wheels-windows-x64
    env:
      EXPECTED_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Smoke test in an Alpine container (musl)
        if: ${{ matrix.alpine }}
        shell: bash
        run: |
          ls dist
          docker run --rm -e EXPECTED_VERSION -v "$PWD:/w" -w /w python:3.12-alpine sh -ec '
            python -m venv /tmp/venv
            wheel=$(ls dist/*.whl | head -n 1)
            /tmp/venv/bin/pip install --quiet "$wheel" scipy
            cd /tmp
            /tmp/venv/bin/python /w/.github/scripts/smoke_test.py "$EXPECTED_VERSION"'
      - uses: actions/setup-python@v6
        if: ${{ !matrix.alpine }}
        with:
          python-version: "3.12"
      - name: Smoke test in a fresh virtual environment
        if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          ls dist
          python -m venv "$RUNNER_TEMP/venv"
          if [ -d "$RUNNER_TEMP/venv/Scripts" ]; then PY="$RUNNER_TEMP/venv/Scripts/python"; else PY="$RUNNER_TEMP/venv/bin/python"; fi
          wheel=$(ls dist/*.whl | head -n 1)
          "$PY" -m pip install --quiet "$wheel" scipy
          cd "$RUNNER_TEMP"
          "$PY" "$GITHUB_WORKSPACE/.github/scripts/smoke_test.py" "$EXPECTED_VERSION"

  publish:
    # final tags -> PyPI (environment `pypi`, owner approval); rc tags and manual dry runs -> TestPyPI (environment `testpypi`)
    name: publish
    needs: [version, test, docs, sdist, linux, musllinux, windows, macos, smoke]
    if: ${{ needs.version.outputs.publish_target == 'pypi' || needs.version.outputs.publish_target == 'testpypi' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.version.outputs.publish_target }}
      url: ${{ needs.version.outputs.publish_target == 'pypi' && format('https://pypi.org/project/crest-sc/{0}/', needs.version.outputs.version) || format('https://test.pypi.org/project/crest-sc/{0}/', needs.version.outputs.version) }}
    permissions:
      # trusted publishing (OIDC) to PyPI / TestPyPI
      id-token: write
      contents: read
      # artifact attestations
      attestations: write
    env:
      TARGET: ${{ needs.version.outputs.publish_target }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: List what will be uploaded
        run: ls -l dist
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: 'dist/*'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Choose the index
        run: |
          if [ "$TARGET" = "pypi" ]; then
            echo "PUBLISH_URL=https://upload.pypi.org/legacy/" >> "$GITHUB_ENV"
            echo "CHECK_URL=https://pypi.org/simple/" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_URL=https://test.pypi.org/legacy/" >> "$GITHUB_ENV"
            echo "CHECK_URL=https://test.pypi.org/simple/" >> "$GITHUB_ENV"
          fi
      - name: Publish with trusted publishing
        id: oidc
        continue-on-error: true
        # files that are already on the index are skipped, so a re-run after a partial upload is safe
        run: uv publish --trusted-publishing always --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" 'dist/*'
      - name: Publish with an API token (fallback when trusted publishing is not configured)
        if: ${{ steps.oidc.outcome == 'failure' }}
        env:
          UV_PUBLISH_TOKEN: ${{ needs.version.outputs.publish_target == 'pypi' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error::Trusted publishing failed and no API token secret is set for $TARGET"
            exit 1
          fi
          uv publish --trusted-publishing never --publish-url "$PUBLISH_URL" --check-url "$CHECK_URL" 'dist/*'

  github-release:
    # a GitHub Release is created from a final tag after PyPI accepted the files; Zenodo archives releases
    name: GitHub Release
    needs: [version, publish]
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.version.outputs.publish_target == 'pypi' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 - <<'EOF' > notes.md
          import os, re
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"CREST {version}")
          EOF
          gh release create "$TAG" dist/* --verify-tag --title "CREST $VERSION" --notes-file notes.md
