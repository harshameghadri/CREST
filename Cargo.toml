[package]
name = "crest"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "CREST - Columnar Rust Engine for Single-cell Transcriptomics"
repository = "https://github.com/harshameghadri/CREST"

[lib]
name = "crest"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py310"] }
numpy = "0.21"
pyo3-polars = { version = "0.15.0", features = ["derive"] }
polars = { version = "0.41.3", default-features = false, features = ["lazy"] }
statrs = "0.16.1"
nalgebra = "0.32.3"
faer = "0.24.0"
rand = "0.8.5"
rand_distr = "0.4.3"
rayon = "1.11.0"
