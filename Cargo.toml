[package]
name = "biopolars"
version = "0.1.0"
edition = "2021"

[lib]
name = "biopolars"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module"] }
pyo3-polars = { version = "0.15.0", features = ["derive"] }
polars = { version = "0.41.3", default-features = false, features = ["lazy"] }
serde = { version = "1", features = ["derive"] }
statrs = "0.16.1"
nalgebra = "0.32.3"
nalgebra-sparse = "0.9.0"
single-svdlib = "1.0.9"
rag-umap = "0.0.0"
petgraph = "0.8.3"
graphrs = "0.11.16"
kiddo = "5.2.4"
