[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "crest"
description = "CREST — Columnar Rust Engine for Single-cell Transcriptomics"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CREST Contributors"}]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

dependencies = [
    "polars>=1.0.0,<2.0.0",
    "numpy>=1.24.0,<3.0.0",
]

[project.optional-dependencies]
slaf = ["slafdb>=0.4.0"]
all = ["slafdb>=0.4.0", "matplotlib>=3.5.0"]

[project.urls]
Repository = "https://github.com/crest-bio/crest"
