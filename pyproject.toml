[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "crest-sc"
description = "CREST: Columnar Rust Engine for Single-cell Transcriptomics - scanpy-compatible, out-of-core single-cell analysis with native Rust kernels"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "harshameghadri" }]
requires-python = ">=3.10"
keywords = ["single-cell", "scRNA-seq", "bioinformatics", "polars", "rust", "scanpy", "out-of-core"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "scipy>=1.10"]
slaf = ["slafdb>=0.4.0"]
test = ["pytest>=7", "scipy>=1.10", "anndata>=0.10", "scanpy>=1.10", "scikit-learn>=1.3", "igraph>=0.11"]
bench = ["scanpy>=1.10", "scikit-learn>=1.3", "igraph>=0.11", "leidenalg>=0.10", "psutil>=5.9", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/harshameghadri/CREST"
Issues = "https://github.com/harshameghadri/CREST/issues"

[tool.maturin]
python-source = "."
module-name = "crest.crest"
features = ["pyo3/extension-module"]
exclude = ["crest/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
