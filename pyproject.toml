[build-system]
requires = ["maturin>=1.12,<2.0"]
build-backend = "maturin"

[project]
name = "crest-sc"
description = "CREST: Chunked Rust Engine for Single-cell Transcriptomics - scanpy-compatible, out-of-core single-cell analysis with native Rust kernels"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sri Harsha Meghadri" }]
requires-python = ">=3.10"
keywords = ["single-cell", "scRNA-seq", "bioinformatics", "polars", "rust", "scanpy", "out-of-core"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = [
    "numpy>=1.24,<3",
    "polars>=1.0",
    "h5py>=3.8",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10", "scipy>=1.10"]
# The reference stack behind the scanpy / harmonypy / leidenalg parity tests is pinned so that a
# CI run is reproducible: scanpy 1.11.5 needs pynndescent 0.6.x and umap-learn 0.5.x (with
# pynndescent 0.7 / umap-learn 0.6 `sc.pp.neighbors` fails above ~8k cells and `sc.pp.scrublet`
# fails), and was validated with scipy < 1.18, anndata < 0.13 and pandas < 3.
test = ["pytest>=7", "scipy>=1.10,<1.18", "anndata>=0.10,<0.13", "pandas>=2,<3", "scanpy==1.11.5",
        "pynndescent==0.6.0", "umap-learn==0.5.12", "harmonypy==2.1.0", "leidenalg==0.12.0",
        "scikit-learn>=1.3", "igraph>=0.11,<1.1", "scikit-misc>=0.3", "scikit-image>=0.21", "psutil>=5.9"]
bench = ["scanpy>=1.10", "anndata>=0.10", "scipy>=1.10", "scikit-learn>=1.3", "igraph>=0.11", "leidenalg>=0.10",
         "psutil>=5.9", "matplotlib>=3.7", "threadpoolctl>=3", "harmonypy>=2.0", "scikit-misc>=0.3",
         "scikit-image>=0.21", "pydeseq2>=0.4", "pandas>=2"]

[project.urls]
Documentation = "https://crest-sc.readthedocs.io"
Repository = "https://github.com/harshameghadri/CREST"
Issues = "https://github.com/harshameghadri/CREST/issues"

[tool.maturin]
python-source = "."
module-name = "crest.crest"
features = ["pyo3/extension-module"]
exclude = [
    "crest/__pycache__/**",
    # the source distribution carries only what is needed to build and test the package
    { path = "bench/**/*", format = "sdist" },
    { path = "scripts/**/*", format = "sdist" },
    { path = ".github/**/*", format = "sdist" },
    { path = "changes/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "baseline_fails(ref, raises, match=None): the test describes a defect present in the reference build `ref`; under --baseline-ref=<ref> it must raise `raises` (matching the regex `match` against str(exception) when given); ignored in normal runs",
]
